# hashd mirror build: the two static Linux binaries hashd pins, built from this
# branch (an upstream tag plus hashd's patches) with upstream's own recipe --
# the build, candidate and packaging steps of _build.yml's build-linux-portable
# job, with the stripped candidate packaged as upstream's releases do.
# Runs on every push to a hashd/<upstream tag> branch; the binary reports that
# tag as its version. The archives and their provenance attestations are the
# output. Publishing them as a release is a separate, manual step.
name: hashd Linux portable

on:
  push:
    branches:
      - 'hashd/v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 is built by build-amd64 below, for baseline x86-64.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI (static)
        run: scripts/build.sh --with-ui --version "${GITHUB_REF_NAME#hashd/}" CC=gcc CXX=g++ STATIC=1

      - name: Verify release static linking
        run: |
          file build/c/codebase-memory-mcp
          ldd build/c/codebase-memory-mcp 2>&1 | grep -q "not a dynamic executable" || ldd build/c/codebase-memory-mcp 2>&1 | grep -q "statically linked"

      - name: Derive candidates and package the stripped one
        run: |
          export VERSION="${GITHUB_REF_NAME#hashd/}"
          target="linux-${{ matrix.arch }}-portable"
          scripts/ci/prepare-release-candidates.sh \
            linux "${{ matrix.arch }}-portable" \
            --binary build/c/codebase-memory-mcp \
            --out-dir release-candidates
          scripts/gen-third-party-notices.sh "release-candidates/$target/THIRD_PARTY_NOTICES.md"
          selected="release-candidates/$target/stripped/codebase-memory-mcp"
          selected_sha="$(sha256sum "$selected" | cut -d' ' -f1)"
          scripts/package-release.sh linux "${{ matrix.arch }}-portable" \
            --selected-binary "$selected" \
            --expected-sha256 "$selected_sha" \
            --third-party-notices "release-candidates/$target/THIRD_PARTY_NOTICES.md" \
            --out-dir release-containers
          "$selected" --version
          (cd release-containers && sha256sum "codebase-memory-mcp-$target.tar.gz" | tee "codebase-memory-mcp-$target.tar.gz.sha256")

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-containers/codebase-memory-mcp-linux-${{ matrix.arch }}-portable.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashd-linux-${{ matrix.arch }}-portable
          path: |
            release-containers/codebase-memory-mcp-linux-${{ matrix.arch }}-portable.tar.gz
            release-containers/codebase-memory-mcp-linux-${{ matrix.arch }}-portable.tar.gz.sha256
          if-no-files-found: error

  # linux-amd64 for every x86-64 CPU: upstream's recipe with GCC 15 on Ubuntu
  # 26.04's baseline packages, in a container. Not the ubuntu-26.04 runner
  # image itself: it installs Ubuntu's amd64v3 package variants, whose GCC
  # defaults to -march=x86-64-v3 and whose static glibc runs v3 instructions at
  # startup, so its binary dies with SIGILL on CPUs without AVX2/BMI2. glibc and
  # zstd still pick their AVX2/AVX-512/BMI2 variants at run time.
  build-amd64:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 240
    steps:
      - name: Install deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential zlib1g-dev git file curl xz-utils python3 zip ca-certificates binutils qemu-user

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Compiler targets baseline x86-64
        run: |
          gcc --version | head -1
          if echo | gcc -dM -E - | grep -E '__AVX2__|__BMI2__'; then
            echo "::error::gcc defaults above baseline x86-64"
            exit 1
          fi

      - name: Build release binary with UI (static)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh --with-ui --version "${GITHUB_REF_NAME#hashd/}" CC=gcc CXX=g++ STATIC=1

      - name: Verify release static linking
        run: |
          file build/c/codebase-memory-mcp
          ldd build/c/codebase-memory-mcp 2>&1 | grep -q "not a dynamic executable" || ldd build/c/codebase-memory-mcp 2>&1 | grep -q "statically linked"

      - name: Verify the binary runs on CPUs without AVX and without AVX2/BMI2
        run: |
          qemu-x86_64 -cpu qemu64 build/c/codebase-memory-mcp --version
          qemu-x86_64 -cpu SandyBridge build/c/codebase-memory-mcp --version

      - name: Derive candidates and package the stripped one
        run: |
          export VERSION="${GITHUB_REF_NAME#hashd/}"
          target="linux-amd64-portable"
          scripts/ci/prepare-release-candidates.sh \
            linux amd64-portable \
            --binary build/c/codebase-memory-mcp \
            --out-dir release-candidates
          scripts/gen-third-party-notices.sh "release-candidates/$target/THIRD_PARTY_NOTICES.md"
          selected="release-candidates/$target/stripped/codebase-memory-mcp"
          selected_sha="$(sha256sum "$selected" | cut -d' ' -f1)"
          scripts/package-release.sh linux amd64-portable \
            --selected-binary "$selected" \
            --expected-sha256 "$selected_sha" \
            --third-party-notices "release-candidates/$target/THIRD_PARTY_NOTICES.md" \
            --out-dir release-containers
          "$selected" --version
          qemu-x86_64 -cpu qemu64 "$selected" --version
          qemu-x86_64 -cpu SandyBridge "$selected" --version
          (cd release-containers && sha256sum "codebase-memory-mcp-$target.tar.gz" | tee "codebase-memory-mcp-$target.tar.gz.sha256")

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-containers/codebase-memory-mcp-linux-amd64-portable.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashd-linux-amd64-portable
          path: |
            release-containers/codebase-memory-mcp-linux-amd64-portable.tar.gz
            release-containers/codebase-memory-mcp-linux-amd64-portable.tar.gz.sha256
          if-no-files-found: error
